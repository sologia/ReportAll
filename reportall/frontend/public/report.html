<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Crear reporte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
  <style>
    #map { height: 400px; margin-bottom: 1rem; }
    form { max-width: 600px; }
  </style>
</head>
<body>
  <h1>Crear reporte</h1>

  <div id="map"></div>

  <form id="reportForm">
    <div>
      <label>Problema: <input id="Name_Problem" name="Name_Problem" required /></label>
    </div>
    <div>
      <label>Urgencia: <input id="Urgency" name="Urgency" /></label>
    </div>
    <div>
      <label>Dirección: <input id="Adress" name="Adress" /></label>
    </div>
    <div>
      <label>Sector: <input id="Name_Sector" name="Name_Sector" /></label>
    </div>
    <div>
      <label>Fecha y hora: <input id="Date_Time" name="Date_Time" type="datetime-local" /></label>
    </div>
    <div>
      <label>ClientID: <input id="ClientID" name="ClientID" type="number" /></label>
    </div>
    <div>
      <label>Foto (opcional): <input id="BINPhoto" name="BINPhoto" type="file" accept="image/*" /></label>
    </div>

    <div style="margin-top:0.5rem">
      <button id="btnMark">Marcar en mapa (clic)</button>
      <button id="btnUseCenter">Usar centro del mapa</button>
      <button id="btnClear">Borrar geometría</button>
    </div>

    <div style="margin-top:0.5rem">
      <button type="submit">Enviar reporte</button>
    </div>

    <div id="status" style="margin-top:0.5rem;color:#333"></div>
  </form>

  <script type="module">
    // Si tu bundler sirve src directo, importa así. Si usas bundler, ajusta las rutas a tu bundle final.
    import '/src/map.js';
    import '/src/reportForm.js';
  </script>
</body>
</html>
